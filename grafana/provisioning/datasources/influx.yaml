apiVersion: 1
datasources:
  - name: InfluxDB
    uid: feedwatch-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: feedwatch
      defaultBucket: feedwatch
    secureJsonData:
      token: $INFLUX_TOKEN
