# Production stack on the EC2 host (docs/DEPLOYMENT.md). Not used locally.
# scripts/aws/deploy.sh exports REGISTRY (ECR host), TAG, AWS_REGION, SITE_ADDRESS and SITE_URL, and
# writes /opt/feedwatch/.env (mode 600) from SSM Parameter Store. Logs go to CloudWatch Logs.
name: feedwatch

services:
  router:
    image: caddy:2.11.9-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/feedwatch/site:/srv/site:ro
      - caddy-data:/data
    depends_on: [api, grafana]
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/router },
      }
    restart: unless-stopped

  poller:
    image: ${REGISTRY}/feedwatch-poller:${TAG:-latest}
    env_file: /opt/feedwatch/.env
    depends_on:
      influxdb: { condition: service_healthy }
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/poller },
      }
    restart: unless-stopped

  api:
    image: ${REGISTRY}/feedwatch-api:${TAG:-latest}
    env_file: /opt/feedwatch/.env
    environment:
      FEEDWATCH_API_ADDR: 0.0.0.0:8080
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/api },
      }
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1
    env_file: /opt/feedwatch/.env
    volumes: [influxdb-data:/var/lib/influxdb2]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 6
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/influxdb },
      }
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    env_file: /opt/feedwatch/.env
    environment:
      GF_SERVER_ROOT_URL: ${SITE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb: { condition: service_healthy }
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/grafana },
      }
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
  caddy-data:
