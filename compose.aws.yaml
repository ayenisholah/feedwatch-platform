# Production stack on the EC2 host (see docs/DEPLOYMENT.md). Not used locally.
# ${REGISTRY} is the ECR registry host; ${TAG} is the image tag CI deploys. Secrets come from
# /opt/feedwatch/.env, which the host writes from SSM Parameter Store at boot.
name: feedwatch

x-logs: &logs
  driver: awslogs
  options: { awslogs-region: "${AWS_REGION}", awslogs-create-group: "false" }

services:
  router:
    image: nginx:1.31.8-alpine
    ports: ["80:80"]
    volumes: [./nginx/feedwatch.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api, grafana]
    restart: unless-stopped

  poller:
    image: ${REGISTRY}/feedwatch-poller:${TAG}
    env_file: /opt/feedwatch/.env
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/poller },
      }
    depends_on: [influxdb]
    restart: unless-stopped

  api:
    image: ${REGISTRY}/feedwatch-api:${TAG}
    env_file: /opt/feedwatch/.env
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/api },
      }
    depends_on: [influxdb]
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1
    env_file: /opt/feedwatch/.env
    volumes: [influxdb-data:/var/lib/influxdb2]
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/influxdb },
      }
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    env_file: /opt/feedwatch/.env
    environment:
      GF_SERVER_ROOT_URL: https://feedwatch.sholaayeni.xyz/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      {
        driver: awslogs,
        options: { awslogs-region: "${AWS_REGION}", awslogs-group: /feedwatch/grafana },
      }
    restart: unless-stopped

volumes:
  influxdb-data:
