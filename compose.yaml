# Local stack. The poller builds from the sibling repo (../feedwatch-poller); the API joins in M2.
# Images are pinned; update them in a pull request.
name: feedwatch

services:
  influxdb:
    image: influxdb:2.9.1
    ports: ["127.0.0.1:8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: feedwatch
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: feedwatch
      DOCKER_INFLUXDB_INIT_BUCKET: feedwatch
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes: [influxdb-data:/var/lib/influxdb2]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 6

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb: { condition: service_healthy }

  poller:
    build: ../feedwatch-poller
    image: feedwatch-poller:local
    ports: ["127.0.0.1:8081:8081"]
    environment:
      RUST_LOG: info
      FEEDWATCH_RPC_ETHEREUM: ${FEEDWATCH_RPC_ETHEREUM:-https://ethereum-rpc.publicnode.com}
      FEEDWATCH_RPC_ARBITRUM: ${FEEDWATCH_RPC_ARBITRUM:-https://arbitrum-one-rpc.publicnode.com}
      FEEDWATCH_RPC_BASE: ${FEEDWATCH_RPC_BASE:-https://base-rpc.publicnode.com}
      FEEDWATCH_POLL_INTERVAL_SECS: ${FEEDWATCH_POLL_INTERVAL_SECS:-60}
      FEEDWATCH_HEALTH_ADDR: 0.0.0.0:8081
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on:
      influxdb: { condition: service_healthy }
    restart: unless-stopped

  # Added in M2, once feedwatch-api serves data:
  # api:
  #   build: ../feedwatch-api

volumes:
  influxdb-data:
