# Only CloudFront reaches this (security group allows CloudFront's prefix list on port 80).
server {
  listen 80;
  server_tokens off;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /grafana/ { proxy_pass http://grafana:3000; proxy_set_header Host $host; }
  location = /healthz { return 200 "ok\n"; }
  location / { return 404; }
}
